services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OUTPUT_DIR=${OUTPUT_DIR:-/output}
      - HF_HOME=/hf_cache
    volumes:
      - ${OUTPUT_DIR:-./output}:/output
      - hf_cache:/hf_cache
      - /tmp/pdf2epub:/tmp/pdf2epub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  hf_cache:
