services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Path *inside the container* the app writes EPUBs to. This must be the
      # mount target below (/output), NOT the host path in .env — otherwise a
      # relative host OUTPUT_DIR (e.g. ./output) makes the app write to
      # /app/output, outside the volume, and the files never reach the host.
      - OUTPUT_DIR=/output
      - HF_HOME=/hf_cache
      # Reduce CUDA memory fragmentation so the model fits on a shared/near-full GPU.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - ${OUTPUT_DIR:-./output}:/output
      - hf_cache:/hf_cache
      - /tmp/pdf2epub:/tmp/pdf2epub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  hf_cache:
